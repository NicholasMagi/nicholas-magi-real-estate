name: NMRE Mobile validation

on:
  push:
    branches:
      - feat/mobile-phone-contacts-sync
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-contacts-ci.yml"

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Expo Doctor (baseline SDK version drift)
        run: npm run check:expo
        continue-on-error: true
