name: Validate application code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Gmail Edge Function TypeScript
        run: deno check supabase/functions/nmre-gmail-scheduled/index.ts supabase/functions/nmre-gmail-push/index.ts supabase/functions/nmre-search-engine/index.ts supabase/functions/nmre-insights-sync/index.ts supabase/functions/nmre-subito-dry-run/index.ts

      - name: Test Gmail parser and incremental history adapter
        run: deno test supabase/functions/nmre-gmail-scheduled/parser_test.ts supabase/functions/nmre-gmail-scheduled/history_test.ts supabase/functions/nmre-gmail-scheduled/_shared/parser.test.ts

      - name: Test opportunity retention rules, property filter diagnostics and dubious alerts
        run: deno test supabase/functions/nmre-gmail-scheduled/retention_test.ts supabase/functions/nmre-gmail-scheduled/property_filter_test.ts supabase/functions/nmre-gmail-scheduled/dubious_test.ts

      - name: Test sync protections (repeated re-reads, seen marker, concurrent manual edits)
        run: deno test supabase/functions/nmre-gmail-scheduled/sync_protection_test.ts supabase/functions/nmre-gmail-scheduled/regressions_test.ts supabase/functions/nmre-gmail-scheduled/resilience_test.ts

      - name: Test frontend and sync coherence, cursor and notification guarantees
        run: deno test --allow-read=. supabase/functions/nmre-gmail-scheduled/frontend_coherence_test.ts supabase/functions/nmre-gmail-scheduled/cursor_guard_test.ts

      - name: Test Subito saved-search emails (recognition, results page, new listings, dedup, errors, card links)
        run: deno test --allow-read=. supabase/functions/nmre-gmail-scheduled/subito_test.ts supabase/functions/nmre-gmail-scheduled/subito_frontend_test.ts supabase/functions/nmre-gmail-scheduled/subito_real_test.ts supabase/functions/nmre-gmail-scheduled/subito_item_candidates_test.ts supabase/functions/nmre-gmail-scheduled/subito_full_search_test.ts

      - name: Test recovery panel functions in index.html
        run: node tests/frontend/recovery_test.mjs

      - name: Test recovery panel loading (loadCandidateRecovery) with simulated failures
        run: node tests/frontend/recovery_load_test.mjs

      - name: Test guarded archive preparation (prepareCandidateForArchive)
        run: node tests/frontend/archive_persist_test.mjs

      - name: Test automatic contact matching and safe property linking
        run: node tests/frontend/contact_autolink_test.mjs

      - name: Test Gmail sync health alert
        run: node tests/frontend/sync_alert_test.mjs

      - name: Test phone address book import (vCard, Contact Picker) and duplicate detection
        run: node tests/frontend/contacts_import_test.mjs

      - name: Test unified search across opportunities and archive
        run: node tests/frontend/listing_search_test.mjs

      - name: Test Subito browser import preview and safe candidate mapping
        run: node tests/frontend/subito_browser_import_test.mjs

      - name: Check service worker build version consistency
        run: node tests/frontend/service_worker_version_test.mjs
      - name: Test Subito saved-search sync log panel
        run: node tests/frontend/subito_search_log_test.mjs

      - name: Check migration layout (phase 2 not applicable, production versions)
        run: |
          bash supabase/tests/check_migration_layout.sh
          # Auto-verifica: con la Fase 2 rimessa in supabase/migrations il controllo deve fallire.
          copy="$(mktemp -d)"
          cp -r supabase "$copy/"
          cp "$copy/supabase/migrations_pending/20261125201000_gmail_dubious_alerts.sql" "$copy/supabase/migrations/"
          if NMRE_LAYOUT_ROOT="$copy" bash supabase/tests/check_migration_layout.sh > /dev/null 2>&1; then
            echo "Il controllo non ha rilevato la Fase 2 in supabase/migrations" >&2
            exit 1
          fi
          echo "Auto-verifica superata: la Fase 2 in supabase/migrations viene rilevata."

      - name: Test Subito dry run (single email, read-only database and Gmail, no writes)
        run: deno test --allow-read=. supabase/functions/nmre-subito-dry-run/dry_run_test.ts supabase/functions/nmre-subito-dry-run/readonly_test.ts supabase/functions/nmre-subito-dry-run/index_guard_test.ts supabase/functions/nmre-subito-dry-run/full_search_dry_run_test.ts

      - name: Test Immobiliare Insights API adapter
        run: deno test supabase/functions/nmre-insights-sync/provider_test.ts

      - name: Check embedded frontend JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_module = False
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script" and dict(attrs).get("type") == "module":
                      self.in_module = True

              def handle_endtag(self, tag):
                  if tag == "script" and self.in_module:
                      self.in_module = False

              def handle_data(self, data):
                  if self.in_module:
                      self.parts.append(data)

          parser = ScriptExtractor()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          source = "".join(parser.parts)
          if not source.strip():
              raise SystemExit("No module script found in index.html")
          Path("/tmp/nmre-frontend.mjs").write_text(source, encoding="utf-8")
          PY
          node --check /tmp/nmre-frontend.mjs

      - name: Check duplicate HTML ids
        run: |
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path

          class IdCollector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []

              def handle_starttag(self, tag, attrs):
                  value = dict(attrs).get("id")
                  if value:
                      self.ids.append(value)

          parser = IdCollector()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          duplicates = [key for key, count in Counter(parser.ids).items() if count > 1]
          if duplicates:
              raise SystemExit("Duplicate HTML ids: " + ", ".join(duplicates))
          print(f"Checked {len(parser.ids)} unique element ids.")
          PY

      - name: Validate Supabase function configuration
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("supabase/config.toml").read_text(encoding="utf-8"))
          functions = config.get("functions", {})
          scheduled = functions.get("nmre-gmail-scheduled", {})
          if scheduled.get("verify_jwt") is not False:
              raise SystemExit("nmre-gmail-scheduled must keep verify_jwt = false")
          unexpected = [
              name for name, options in functions.items()
              if name != "nmre-gmail-scheduled" and options.get("verify_jwt") is False
          ]
          if unexpected:
              raise SystemExit("Unexpected functions with verify_jwt disabled: " + ", ".join(unexpected))
          print("Supabase config TOML is valid; only nmre-gmail-scheduled disables platform JWT verification.")
          PY
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test migrations and rollbacks on a disposable database
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: supabase/tests/run_migration_tests.sh

  deploy-pages:
    name: Deploy GitHub Pages (after CI)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [validate, migrations]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble minimal Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest icon.svg _site/
          touch _site/.nojekyll
          python3 - <<'PY'
          import json
          from pathlib import Path

          site = Path("_site")
          expected = {".nojekyll", "index.html", "sw.js", "manifest.webmanifest", "icon.svg"}
          actual = {path.name for path in site.iterdir()}
          if actual != expected:
              raise SystemExit(f"Unexpected Pages artifact files: {sorted(actual)}")
          html = (site / "index.html").read_text(encoding="utf-8")
          for reference in ("./manifest.webmanifest", "./icon.svg", "./sw.js"):
              if reference not in html:
                  raise SystemExit(f"index.html is missing runtime reference: {reference}")
          manifest = json.loads((site / "manifest.webmanifest").read_text(encoding="utf-8"))
          if not any(icon.get("src") == "./icon.svg" for icon in manifest.get("icons", [])):
              raise SystemExit("manifest.webmanifest does not reference the published icon.svg")
          print("Pages artifact contains only the four runtime files and .nojekyll.")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
